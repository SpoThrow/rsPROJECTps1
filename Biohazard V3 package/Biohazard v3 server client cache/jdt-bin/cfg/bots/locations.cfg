# Data/cfg/bots/locations.cfg
#
# Authored places for the bot data layer (BOT_ROADMAP.md phase C, BOT_LOCATIONS.md A.3).
#
# WHAT BELONGS HERE, AND WHAT DOES NOT
#
# Only names and tags: the things no existing file can answer. Teleports, shops and monsters are
# NOT here, because Data/cfg already holds them and Locations joins them at load time
# (LocationsData). Copying them here would create a second source of truth for facts the server
# already owns, and the two would drift the first time a shop changed.
#
# So there are three rows here that are genuinely authored: banks, a resource region, and an altar
# the server labels by an action rather than by name. Everything else is joined.
#
# FORMAT
#
#   point  = <name> x <x> y <y>          plane <p> kind <kind> [tags a,b,c]
#   region = <name> x <x> y <y> w <w> h <h> plane <p> kind <kind> [tags a,b,c]
#
# A point is exactly 1x1. A region MUST state w and h — a missing size is rejected rather than
# silently becoming one tile, because "the whole mining site" and "one rock" are very different
# things for a bot to be sent to.
#
# kind is one of: tree, rock, fishing, bank, cooking, smithing, prayer, shop, teleport, monster,
# master. The place-words mine, anvil, range, altar and fish are accepted as aliases of
# rock, smithing, cooking, prayer and fishing, so a hand-written row is never rejected over a
# spelling.
#
# A box that overlaps another of the same kind is fine; overlapping boxes are what a harvested
# region looks like. A box that contains NO matching object is a bug and `gradlew workshopValidate`
# reports it — see the note at the end of this file.
#
# WHERE THE COORDINATES CAME FROM
#
# Every box below was measured, not guessed: the server's world was scanned for classified objects
# and the boxes are the exact extents of the clusters found. `workshopValidate` re-derives those
# extents and fails if a box no longer contains the objects it claims.


# ---- banks ---------------------------------------------------------------------------------
#
# Three banks, on two planes. The plane matters: Lumbridge's castle bank is at 3207,3221 on plane 2,
# twenty-one tiles from the same coordinates on plane 0, where there is only wall
# (BOT_LOCATIONS.md A.6). A locator that ignored the plane would walk bots into it.

# Draynor: nine booths in two columns, x 3091 and x 3096.
region = draynor_bank          x 3091 y 3241 w 6 h 5  plane 0  kind bank  tags draynor

# Lumbridge castle: four booths along one wall, one plane up from the courtyard.
region = lumbridge_castle_bank x 3207 y 3221 w 4 h 1  plane 2  kind bank  tags lumbridge,castle

# Varrock west: six booths in a row.
region = varrock_west_bank     x 3251 y 3419 w 6 h 1  plane 0  kind bank  tags varrock


# ---- altars --------------------------------------------------------------------------------
#
# The only altar among the regions measured. Note the coordinates: the altar is at 3243,3207, which
# is the Lumbridge church, not the coordinates the design doc sketched.

point = lumbridge_altar        x 3243 y 3207          plane 0  kind prayer tags lumbridge


# ---- trees ---------------------------------------------------------------------------------
#
# Draynor and Lumbridge, with tags recording which species was actually found in each box. The tags
# are what a script asks for ("nearest oak"), so they are worth being precise about: a box tagged
# oak that contains three dead trees is a box that will disappoint a bot.

# Draynor, north of the bank: the densest oak stand measured — 23 objects.
region = draynor_oaks          x 3103 y 3217 w 16 h 23 plane 0  kind tree  tags oak,draynor

# Draynor, south of the bank, along the river: 20 objects, likewise oak.
region = draynor_trees         x 3099 y 3242 w 21 h 19 plane 0  kind tree  tags oak,draynor

# Lumbridge, east of the castle: the only willows measured.
region = lumbridge_willows     x 3217 y 3241 w 17 h 20 plane 0  kind tree  tags willow,lumbridge

# Varrock, south-east: 19 objects, oak among dead trees.
region = varrock_trees         x 3240 y 3241 w 23 h 19 plane 0  kind tree  tags oak,varrock

# Varrock, further south: a small oak clump.
region = varrock_oaks          x 3223 y 3434 w 15 h 9  plane 0  kind tree  tags oak,varrock

# A single yew, as a point — the only one measured, and a single-tile row shows the point form.
point  = varrock_yew           x 3249 y 3201          plane 0  kind tree  tags yew,varrock


# ---- what is deliberately missing ----------------------------------------------------------
#
# Rocks and fishing spots have NO rows, and that is not an oversight. The regions measured for this
# first pass contain no classified rocks or fishing spots, so there is nothing to write a box around
# — and inventing coordinates would be worse than leaving them out, because a wrong box is a bot
# walking to nowhere.
#
# Both resolve anyway: a locator that has no curated answer falls through to a world scan
# (LocationsData -> MergingLocator -> ScannedLocator), so `trees().nearest(...)` and
# `rocks().nearest(...)` both answer today. The curated table is an optimisation and a place to put
# human names, not a prerequisite.
#
# Anvils and ranges are also absent, for the same reason and one more: no object in this cache
# carries a Smith or Cook action, so nothing can be classified as one (see ResourceKinds). Adding
# them needs a name- or id-based rule first.
