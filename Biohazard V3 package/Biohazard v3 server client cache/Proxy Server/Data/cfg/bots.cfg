# Data/cfg/bots.cfg
#
# The bots to run (BOT_ROADMAP.md phase E, BOT_ACCOUNTS.md §3).
#
# This file is the operator's record. The character file under Data/characters/ is the
# authoritative account — it holds only an md5 of the password, which a human cannot log in
# with — so the plaintext lives here, where it can be read. Keep this file out of any public
# repository, or move the passwords to a git-ignored file.
#
# FORMAT
#
#   account <name> password <plaintext> script <script-name> [profile <name>] [home <place>] [enabled true|false]
#
#   account   the login name, and the only identity a row has. Must be login-legal: at most
#             12 characters, letters/digits/spaces only (the login decoder refuses anything
#             else), and lowercase by convention. A possessed bot is a real account, so a
#             name a human could not log into is rejected rather than accepted here.
#   password  the plaintext the account was created with. Possession authenticates through
#             the same loadGame path a human login uses, so this must be the real password.
#   script    a registered BotScript name; see ::bot list and BotScripts.
#   profile   the kit the account is created with, from BotProfiles: the tie flag, the tools it
#             owns, its skills and its starting tile. Names are "default", "woodcutter",
#             "miner" and "fisher". Optional, and defaults to "default", which carries a tool
#             for every resource the world supports so that a row needs nothing else to work.
#             Applied ONLY when the character does not exist yet: an account that is already on
#             disk keeps whatever it owns, so editing this after the fact changes nothing.
#   home      an authored place name from Data/cfg/bots/locations.cfg. The bot is moved
#             there when it spawns. Optional: without it, it stands where the account saved.
#   enabled   defaults to true. Set false to park a bot without deleting its credentials.
#
# A missing file means "no bots configured": the server boots exactly as it always did.
# A bad line is reported on the console and skipped, so one typo does not cost you the rest.
#
# EXAMPLES (commented out — uncomment and set a real password to use one). A removed account
# file is recreated on the next boot with the named profile's kit, so a bot can be rebuilt from
# this file alone; delete Data/characters/<name>.txt to start one over.
#
# account botwillow password changeme script gather_oak profile woodcutter home lumbridge_willows
# account botoakh01 password changeme script gather_oak profile woodcutter enabled false


# ---- the two shipped sample bots ----------------------------------------------------------
#
# One for each way a script can arrive: "gather_oak" is the built-in (BotScripts), "chop_and_bank"
# is authored in Data/cfg/bots/chop_and_bank.json. Both do the same four things — walk to the
# trees, chop until full, walk to the bank, deposit — so watching them side by side in the
# workshop's Live bots panel shows a config row and a script file driving the same behaviour.
#
# profile woodcutter is not optional here. Provisioning grants the kit and the levels it implies,
# and a woodcutter is Woodcutting 30: the Draynor willows need 30 and oaks 15, so without it the
# bot would own an axe, walk to the trees it was told to use, and be refused by every one of them.
#
# home draynor_oaks is the nearest curated tree place to where the profile drops the character, and it is
# the plain-tree side of Draynor: plain trees are the majority there, which is what makes the built-in
# script's yield (plain logs, 1511) the one the bot usually banks. Not always — the field is mixed, and a
# bot whose nearest tree is an oak fills up with oak logs and deposits none of them (see the known gap in
# BOT_ACCOUNTS.md §4.1). Two bots rather than one so that a bad draw on one tile does not hide the other.

account oakchopper password ch0pme0ak script gather_oak    profile woodcutter home draynor_oaks enabled true
account oakbanker  password b4nkme0ak script chop_and_bank profile woodcutter home draynor_oaks enabled true

