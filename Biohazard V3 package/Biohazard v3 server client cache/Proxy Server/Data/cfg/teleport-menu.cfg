// Teleport interface destinations.
//
// Format: menu = Category|Name|X|Y|Height|Requirement|Description
//
// Category must be one of: Monsters, Skilling, Wilderness, Bosses, Minigames,
// Cities & Shops.
// The last two fields are text shown on the screen only - teleports are free, so a
// "Requirement" here never gates anything.
//
// X and Y of -1 means "listed but not reachable": the row selects and explains itself,
// but Go! refuses it. Used for bosses whose lair is not in this world's map data yet.
//
// Coordinates are hand-maintained. Everything carried over from teleports.cfg is known
// good because that is what the spellbooks already send players to; the rest are the
// standard 317 spots and are worth eyeballing in game before they are trusted.
//
// Deliberately absent: OSRS-only content. No Zulrah, Zuk, Skotizo, Cerberus, Abyssal
// Sire, Nieve's cave, Catacombs of Kourend or similar - this world ships 317 map data,
// so those rows would teleport into empty terrain.

