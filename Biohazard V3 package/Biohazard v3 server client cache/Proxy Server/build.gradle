plugins {
    id 'application'
}

group = 'com.soultrail'
version = '3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = []
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = []
        }
    }

    // The Bot Workshop exporter/validator — BOT_TOOLING.md stage T1. A sibling track: it reads
    // the server's data and reuses its collision model, but the server never references it and
    // deleting workshop/ leaves the server fully functional. It is a separate source set rather
    // than part of src/ so it stays out of the server jar while still compiling and unit testing
    // under this build (an untested decoder is how the tool and the server would drift apart).
    workshop {
        java {
            srcDirs = ['workshop/src']
        }
        resources {
            srcDirs = []
        }
        compileClasspath += sourceSets.main.output
        runtimeClasspath += sourceSets.main.output
    }
    workshopTest {
        java {
            srcDirs = ['workshop/test']
        }
        resources {
            srcDirs = []
        }
        compileClasspath += sourceSets.main.output + sourceSets.workshop.output
        runtimeClasspath += sourceSets.main.output + sourceSets.workshop.output
    }
}

dependencies {
    // Only the jars the server actually loads. poi, xstream, log4j, RuneTopListV2
    // and jython are unreferenced by the sources and stay off the classpath.
    implementation files(
        'deps/mina.jar',
        'deps/slf4j.jar',
        'deps/slf4j-nop.jar',
        'deps/mysql.jar',
        'deps/GTLVote.jar'
    )

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    workshopImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    workshopTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    workshopTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Sources are UTF-8; Compile.bat left this at the platform default (Cp1252).
    options.encoding = 'UTF-8'
}

application {
    mainClass = 'server.Server'
}

tasks.named('run', JavaExec) {
    // The server resolves ./Data and ./deps relative to the working directory.
    workingDir = projectDir
    standardInput = System.in
    jvmArgs = ['-Xmx4000m']
}

// PlayerSave resolves "./Data/characters/" against the working directory, so tests
// run in a throwaway tree under build/ rather than against real character files.
def testWorkDir = layout.buildDirectory.dir('testwork').get().asFile

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = testWorkDir
    // RealCharacterFilesTest reads (never writes) the live character files to prove the
    // pre-refactor saves still load. Points at the repo copy, which the test task never
    // runs against directly.
    systemProperty 'realCharactersDir', file('Data/characters').absolutePath
    systemProperty 'objectSizeCfg', file('Data/objectSize.cfg').absolutePath
    systemProperty 'serverPropertiesTemplate', file('Data/server.properties.template').absolutePath
    doFirst {
        delete testWorkDir
        new File(testWorkDir, 'Data/characters').mkdirs()
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// ---- Bot Workshop (BOT_TOOLING.md T1) -------------------------------------------------
//
// The exporter decodes the world for the editor; the validator re-loads what the exporter
// wrote through the server's own collision model and fails on a single diverging tile. Both
// run from the project directory so ./Data resolves exactly as it does for the server.

tasks.register('workshopTest', Test) {
    description = 'Runs the Bot Workshop exporter/validator unit tests.'
    group = 'verification'
    testClassesDirs = sourceSets.workshopTest.output.classesDirs
    classpath = sourceSets.workshopTest.runtimeClasspath
    useJUnitPlatform()
    // ObjectSizes resolves ./Data/objectSize.cfg against the working directory, exactly as it does
    // for the server, so the tests run where the server runs. Nothing here writes to Data.
    workingDir = projectDir
    // The decoders are pointed at the real world files by absolute path so nothing depends on
    // the working directory. Same idiom as the objectSizeCfg property the server test task uses.
    systemProperty 'workshopDataRoot', file('Data').absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn 'workshopTest'
}

tasks.register('workshopExport', JavaExec) {
    description = 'Exports Data/world + Data/cfg to JSON for the Bot Workshop editor (T1).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ExportMap'
    workingDir = projectDir
    // Stage 1 emits a whole-map scan; give it room and let it be interruptible.
    jvmArgs = ['-Xmx2000m']
    if (project.hasProperty('workshopRegions')) {
        args = project.property('workshopRegions').toString().split(',')
    }
}

tasks.register('workshopValidate', JavaExec) {
    description = 'Re-loads the exported JSON and checks it against Region.getClipping (T1).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ValidateMap'
    workingDir = projectDir
    jvmArgs = ['-Xmx2000m']
}
