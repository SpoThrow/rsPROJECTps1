plugins {
    id 'application'
}

group = 'com.soultrail'
version = '3.0'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

sourceSets {
    main {
        java {
            srcDirs = ['src']
        }
        resources {
            srcDirs = []
        }
    }
    test {
        java {
            srcDirs = ['test']
        }
        resources {
            srcDirs = []
        }
    }

    // The Bot Workshop exporter/validator — BOT_TOOLING.md stage T1. A sibling track: it reads
    // the server's data and reuses its collision model, but the server never references it and
    // deleting workshop/ leaves the server fully functional. It is a separate source set rather
    // than part of src/ so it stays out of the server jar while still compiling and unit testing
    // under this build (an untested decoder is how the tool and the server would drift apart).
    workshop {
        java {
            srcDirs = ['workshop/src']
        }
        resources {
            srcDirs = []
        }
        compileClasspath += sourceSets.main.output
        // Main's runtime classpath, not just its output: the node-coverage check loads every
        // compiled BotState to ask whether it is annotated, and the ones that reach the network
        // layer (BotPlayer and friends) need main's jars linked to load at all.
        runtimeClasspath += sourceSets.main.runtimeClasspath
    }
    workshopTest {
        java {
            srcDirs = ['workshop/test']
        }
        resources {
            srcDirs = []
        }
        compileClasspath += sourceSets.main.output + sourceSets.workshop.output
        runtimeClasspath += sourceSets.main.runtimeClasspath + sourceSets.workshop.output
    }
}

dependencies {
    // Only the jars the server actually loads. poi, xstream, log4j, RuneTopListV2
    // and jython are unreferenced by the sources and stay off the classpath.
    implementation files(
        'deps/mina.jar',
        'deps/slf4j.jar',
        'deps/slf4j-nop.jar',
        'deps/mysql.jar',
        'deps/GTLVote.jar'
    )

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

    workshopImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    workshopTestImplementation 'org.junit.jupiter:junit-jupiter:5.11.4'
    workshopTestRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.withType(JavaCompile).configureEach {
    // Sources are UTF-8; Compile.bat left this at the platform default (Cp1252).
    options.encoding = 'UTF-8'
    // The Bot Workshop's node registry reflects constructor parameter names into bot-nodes.json
    // (BOT_TOOLING.md T4). Without -parameters they compile to arg0 and BotNodeRegistry refuses
    // to export, rather than shipping an editor schema it cannot label.
    options.compilerArgs += ['-parameters']
}

application {
    mainClass = 'server.Server'
}

tasks.named('run', JavaExec) {
    // The server resolves ./Data and ./deps relative to the working directory.
    workingDir = projectDir
    standardInput = System.in
    jvmArgs = ['-Xmx4000m']
}

// PlayerSave resolves "./Data/characters/" against the working directory, so tests
// run in a throwaway tree under build/ rather than against real character files.
def testWorkDir = layout.buildDirectory.dir('testwork').get().asFile

tasks.named('test', Test) {
    useJUnitPlatform()
    workingDir = testWorkDir
    // The authored scripts are read by AuthoredScriptRunTest, and they are content rather than
    // fixtures: editing one changes what the test should do. Declared as an input so an edit re-runs
    // the test instead of leaving a stale pass behind. Optional, because a checkout with no authored
    // script is the ordinary state and must not fail the build.
    inputs.dir(file('Data/cfg/bots')).withPropertyName('authoredScripts').optional()
    // RealCharacterFilesTest reads (never writes) the live character files to prove the
    // pre-refactor saves still load. Points at the repo copy, which the test task never
    // runs against directly.
    systemProperty 'realCharactersDir', file('Data/characters').absolutePath
    systemProperty 'objectSizeCfg', file('Data/objectSize.cfg').absolutePath
    systemProperty 'serverPropertiesTemplate', file('Data/server.properties.template').absolutePath
    // The bot world layer reads Data/cfg, and the test task runs from build/testwork so ./Data is
    // not the repo's. Point tests at the real directory the same way workshopTest already does,
    // rather than making them reconstruct the path from another property.
    systemProperty 'workshopDataRoot', file('Data').absolutePath
    // ItemHandler resolves item.cfg relative to the working directory, which for this task is the
    // throwaway build/testwork tree and has no Data. Without this the item table is empty in every
    // test, so "this item exists" and "this id has no definition" both assert nothing. Same idiom
    // as workshopDataRoot above.
    systemProperty 'serverCfgDir', file('Data/cfg').absolutePath
    doFirst {
        delete testWorkDir
        new File(testWorkDir, 'Data/characters').mkdirs()
    }
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

// ---- Bot Workshop (BOT_TOOLING.md T1) -------------------------------------------------
//
// The exporter decodes the world for the editor; the validator re-loads what the exporter
// wrote through the server's own collision model and fails on a single diverging tile. Both
// run from the project directory so ./Data resolves exactly as it does for the server.

tasks.register('workshopTest', Test) {
    description = 'Runs the Bot Workshop exporter/validator unit tests.'
    group = 'verification'
    testClassesDirs = sourceSets.workshopTest.output.classesDirs
    classpath = sourceSets.workshopTest.runtimeClasspath
    useJUnitPlatform()
    // ObjectSizes resolves ./Data/objectSize.cfg against the working directory, exactly as it does
    // for the server, so the tests run where the server runs. Nothing here writes to Data.
    workingDir = projectDir
    // The decoders are pointed at the real world files by absolute path so nothing depends on
    // the working directory. Same idiom as the objectSizeCfg property the server test task uses.
    systemProperty 'workshopDataRoot', file('Data').absolutePath
    testLogging {
        events 'passed', 'failed', 'skipped'
        exceptionFormat 'full'
    }
}

tasks.named('check') {
    dependsOn 'workshopTest'
}

tasks.register('workshopExport', JavaExec) {
    description = 'Exports Data/world + Data/cfg to JSON for the Bot Workshop editor (T1).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ExportMap'
    workingDir = projectDir
    // Stage 1 emits a whole-map scan; give it room and let it be interruptible.
    jvmArgs = ['-Xmx2000m']
    if (project.hasProperty('workshopRegions')) {
        args = project.property('workshopRegions').toString().split(',')
    }
    // A contiguous window, for the viewer's continuous multi-region view. Mutually exclusive with
    // workshopRegions in practice: whichever is given last wins, since both land in the same args.
    if (project.hasProperty('workshopArea')) {
        args = ['area=' + project.property('workshopArea').toString()]
    }
}

tasks.register('workshopValidate', JavaExec) {
    description = 'Re-loads the exported JSON and checks it against Region.getClipping (T1).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ValidateMap'
    workingDir = projectDir
    jvmArgs = ['-Xmx2000m']
}

// ---- Bot Workshop node schema (BOT_TOOLING.md T4) -------------------------------------
//
// Reflects every @BotNode on the server's own BotState classes into the palette the editor
// authors trees from. Separate from workshopExport because it reads no world data — it is
// milliseconds, so there is no reason to make it wait on a map scan or vice versa.

tasks.register('workshopExportNodes', JavaExec) {
    description = 'Exports the @BotNode schema to Data/workshop/bot-nodes.json (T4).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ExportBotNodes'
    workingDir = projectDir
}

// ---- Bot Workshop scripts (BOT_TOOLING.md T5) ----------------------------------------
//
// Re-loads Data/cfg/bots/*.json through the server's own loader, so a bad authored script fails
// here rather than appearing as a skipped line in the server's startup log.
tasks.register('workshopValidateScripts', JavaExec) {
    description = 'Re-loads Data/cfg/bots/*.json through the server loader (T5).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ValidateScripts'
    workingDir = projectDir
}

// ---- Bot Workshop script resolution (BOT_TOOLING.md T6b) ------------------------------
//
// Answers whether the kinds a script names exist — the question workshopValidateScripts (can the
// server load it?) and workshopValidate (do the authored boxes contain their objects?) both leave
// open. Reads Data/cfg, and Data/world only when a named kind has no place in the table, so the
// common case stays instant; -PworkshopCensus forces the full count. -Xmx because counting the
// world loads Region, which is what workshopExport needs the same heap for.
tasks.register('workshopResolveScripts', JavaExec) {
    description = 'Checks that the kinds the authored scripts name exist (T6b).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.ResolveScripts'
    workingDir = projectDir
    jvmArgs = ['-Xmx2000m']
    if (project.hasProperty('workshopCensus')) {
        args = ['--world']
    }
}

// ---- Bot Workshop editor model (BOT_TOOLING.md T5b) -----------------------------------
//
// The document model both the timeline and the graph render (`workshop/web/js/script-doc.js`). It is
// the one thing that decides what a document means, and a wrong answer there is a script the editor
// quietly misreads — so it is checked directly rather than only through the browser. Requires a `node`
// on the PATH (the workshop's viewer itself does not); deliberately not wired into `check`, so a
// Java-only build is unaffected.
tasks.register('workshopJsTestScriptDoc', Exec) {
    description = 'Runs the workshop editor model checks under Node (T5b).'
    group = 'bot workshop'
    workingDir = projectDir
    commandLine 'node', 'workshop/web/test/script-doc.test.mjs'
}

tasks.register('workshopJsTestLive', Exec) {
    description = 'Runs the live-view checks under Node (T7).'
    group = 'bot workshop'
    workingDir = projectDir
    commandLine 'node', 'workshop/web/test/live.test.mjs'
}

// One name for the browser-free checks, so a change that breaks either one is caught by the command the
// docs name rather than by the one that happens to be remembered.
tasks.register('workshopJsTest') {
    description = 'Runs every browser-free workshop check under Node.'
    group = 'bot workshop'
    dependsOn 'workshopJsTestScriptDoc', 'workshopJsTestLive'
}

// ---- Bot Workshop viewer (BOT_TOOLING.md T2) -----------------------------------------
//
// Serves the map viewer and the exported JSON over loopback. Deliberately does not depend on
// workshopExport: a re-export takes tens of seconds and usually changes nothing, and the server
// already fails with the exact command to run when the export is missing.
tasks.register('workshopServe', JavaExec) {
    description = 'Serves the Bot Workshop map viewer at http://127.0.0.1:8080 (T2).'
    group = 'bot workshop'
    classpath = sourceSets.workshop.runtimeClasspath
    mainClass = 'botworkshop.serve.WorkshopServer'
    workingDir = projectDir
    if (project.hasProperty('workshopPort')) {
        args = ['--port', project.property('workshopPort').toString()]
    }
    // The game server's live-view port (T7). Passed as a property rather than an argument because it
    // is a fact about the other process, not about this one, and it has a default: most sessions open
    // the map with no game server running at all.
    systemProperty 'botStatusPort',
            project.hasProperty('botStatusPort') ? project.property('botStatusPort').toString() : '8081'
}
